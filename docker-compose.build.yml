# FN2Trakt · 源码构建（开发 / 自建镜像用）
#
# 日常部署请用 docker-compose.yml（直接拉取 spikeding/fn2trakt:4.1.4）。
# 本文件同样不使用 .env，配置直接写在下面。
#
#   docker compose -f docker-compose.build.yml up -d --build

name: fn2trakt

services:
  fn2trakt:
    build:
      context: .
      dockerfile: Dockerfile
    image: fn2trakt:4.1.4
    container_name: fn2trakt
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    ports:
      # 宿主机端口，容器内固定 8080
      - "8213:8080"

    environment:
      TZ: Asia/Shanghai
      PUID: "1000"
      PGID: "1000"
      FN2TRAKT_DATA_DIR: /data
      FN2TRAKT_FNTV_DB_PATH: /fntv/trimmedia.db
      FN2TRAKT_PORT: "8080"
      FN2TRAKT_COOKIE_SECURE: "false"
      FN2TRAKT_SESSION_DAYS: "30"
      FN2TRAKT_SYNC_ENABLED: "true"
      FN2TRAKT_SYNC_INTERVAL_MINUTES: "5"
      FN2TRAKT_TRAKT_TRUST_ENV: "true"
      # HTTPS_PROXY: "http://192.168.1.2:7890"
      # HTTP_PROXY: "http://192.168.1.2:7890"
      # NO_PROXY: "localhost,127.0.0.1"

    volumes:
      - ./data:/data
      - /usr/local/apps/@appdata/trim.media/database:/fntv

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
